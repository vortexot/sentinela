<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>

<body>
  <style>* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: Arial, Helvetica, sans-serif;
  color: #1f2937;
  background: linear-gradient(135deg, #e0f2fe, #ecfdf5);
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 36px;
  background-color: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
}

h2 {
  margin-bottom: 28px;
  color: #0f766e;
  font-size: 28px;
  text-align: center;
}

input,
select {
  width: 100%;
  height: 48px;
  margin-bottom: 16px;
  padding: 0 14px;
  font-size: 15px;
  color: #1f2937;
  background-color: #f9fafb;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder {
  color: #9ca3af;
}

input:focus,
select:focus {
  background-color: #ffffff;
  border-color: #14b8a6;
  box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
}

input[type="file"] {
  height: auto;
  padding: 8px;
  cursor: pointer;
}

input[type="file"]::file-selector-button {
  margin-right: 12px;
  padding: 9px 14px;
  color: #0f766e;
  font-weight: 600;
  background-color: #ccfbf1;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
}

input[type="file"]::file-selector-button:hover {
  background-color: #99f6e4;
}

button {
  width: 100%;
  height: 50px;
  margin-top: 6px;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, #14b8a6, #0f766e);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(15, 118, 110, 0.25);
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 9px 18px rgba(15, 118, 110, 0.3);
}

button:active {
  transform: translateY(0);
}

@media (max-width: 480px) {
  body {
    padding: 16px;
  }

  .container {
    padding: 26px 20px;
  }
}
</style>
<div class="container">
<h2>Atendimento</h2>
<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    tipo: tipo.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
