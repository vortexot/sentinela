<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Hospitalar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dbeafe,#ecfeff,#dcfce7);
}

.container{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
    border:1px solid #ddd;
}

/* Logo */
.logo{
    display:flex;
    justify-content:center;
    margin-bottom:15px;
}

.logo img{
    width:120px;
    height:120px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    border:4px solid #14b8a6;
    padding:8px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

/* Títulos */
h1{
    text-align:center;
    color:#0f766e;
    font-size:28px;
    margin-bottom:5px;
}

.subtitulo{
    text-align:center;
    color:#6b7280;
    margin-bottom:30px;
    font-size:15px;
}

/* Inputs */
input{
    width:100%;
    height:50px;
    margin-bottom:18px;
    padding:0 15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:#f8fafc;
    font-size:15px;
    transition:.3s;
}

input:focus{
    outline:none;
    border-color:#14b8a6;
    background:#fff;
    box-shadow:0 0 0 4px rgba(20,184,166,.15);
}

/* Botão */
button{
    width:100%;
    height:52px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#14b8a6,#0f766e);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(15,118,110,.3);
}

button:active{
    transform:scale(.98);
}

.rodape{
    margin-top:25px;
    text-align:center;
    color:#9ca3af;
    font-size:13px;
}

@media(max-width:480px){
    .container{
        margin:20px;
        padding:30px 25px;
    }

    .logo img{
        width:100px;
        height:100px;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">
        <!-- Troque pela logo do hospital -->
        <img src="/recalque.jpg" alt="Logo do Hospital">
    </div>

    <h1>Hospital São Lucas</h1>
    <p class="subtitulo">Sistema de Gestão Hospitalar</p>

    <input
        id="usuario"
        type="text"
        placeholder="Usuário">

    <input
        id="senha"
        type="password"
        placeholder="Senha">

    <button onclick="login()">Entrar</button>

    <div class="rodape">
        © 2026 Hospital São Lucas
    </div>

</div>

<script>
function login(){

    fetch("http://localhost:3000/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            usuario:document.getElementById("usuario").value,
            senha:document.getElementById("senha").value
        })
    })
    .then(res=>res.json())
    .then(data=>{

        if(data.tipo==="triagem"){
            location.href="triagem.html";
        }
        else if(data.tipo==="medico"){
            location.href="medico.html";
        }
        else if(data.tipo==="atendimento"){
            location.href="atendimento.html";
        }
        else{
            alert("Usuário ou senha inválidos!");
        }

    })
    .catch(()=>{
        alert("Erro ao conectar com o servidor.");
    });

}
</script>

</body>
</html>
